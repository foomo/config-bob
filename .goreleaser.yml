# .goreleaser.yml
version: 2

# Build customization
builds:
  - binary: config-bob
    main: config-bob.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  # Repository to push the tap to.
  - name: config-bob
    repository:
      owner: foomo
      name: homebrew-config-bob
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

    caveats: "config-bob -h"
    homepage: "https://github.com/foomo/config-bob"
    description: "CLI utility to generate secure configurations"
    # the binaries are not notarized, so macOS would quarantine them
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/config-bob"]
          end
