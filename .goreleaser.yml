# .goreleaser.yml
version: 2

# Build customization
builds:
  - binary: config-bob
    main: config-bob.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

brews:
  # Repository to push the tap to.
  - repository:
      owner: foomo
      name: homebrew-config-bob

    caveats: "config-bob -h"
    homepage: "https://github.com/foomo/config-bob"
    description: "CLI utility to generate secure configurations"
